name: Discover roasters (one-off)

on:
  push:
    branches: [uk-roasters]
    paths: ["scripts/discover.py", ".github/workflows/discover.yml", "scripts/scan.py"]

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/discover.py
      - run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/discover.json
          git commit -m "Discovery results" && git pull --rebase -q && git push || echo "nothing to commit"
