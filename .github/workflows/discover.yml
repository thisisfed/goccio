name: Find new roasters

# By hand only: reads the public UK roaster directory, leaves out roasters already on the list, and checks whether the
# scanner can read each new shop. Nothing is added: the result (candidates.json) is attached to the run for review.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Only check these shops (comma-separated links). Leave empty for the whole directory."
        required: false
        default: ""
      contacts:
        description: "Instead: list the public contact emails of these shops (comma-separated links)."
        required: false
        default: ""
      diag:
        description: "Instead: read the pages of coffees with no process and report why (nothing saved). Type yes."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Find and check
        env:
          URLS: ${{ github.event.inputs.urls }}
          DIAG: ${{ github.event.inputs.diag }}
          CONTACTS: ${{ github.event.inputs.contacts }}
        run: |
          if [ -n "$CONTACTS" ]; then python scripts/discover.py --contacts "$CONTACTS"; exit 0; fi
          if [ "$DIAG" = "yes" ]; then python scripts/diag_process.py; exit 0; fi
          if [ -n "$URLS" ]; then python scripts/discover.py --urls "$URLS"; else python scripts/discover.py; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: candidates
          path: data/candidates.json
          if-no-files-found: ignore
