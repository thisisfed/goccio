name: Daily roaster scan

on:
  schedule:
    # every morning at 05:31 UTC (05:31 UK in winter, 06:31 in summer). GitHub can delay or skip scheduled runs,
    # so two backups follow; each one skips itself once today's full scan is in.
    - cron: "31 5 * * *"
    - cron: "13 7 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Rescan only these roasters (comma-separated names). Leave empty for all."
        required: false
        default: ""
      inspect:
        description: "Only print what these product pages say (comma-separated URLs; raw:<url> for the source, text:<url> for the words only); nothing is saved."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Skip if today's full scan is already in
        id: guard
        if: github.event_name == 'schedule'
        run: |
          if git log --format=%s | grep -qx "Roaster scan $(date -u +'%d %b %Y')"; then
            echo "Today's scan is already in, nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: Check the scanner against every reported mistake
        # if an old mistake is back, the scan stops here and yesterday's list stays up
        if: steps.guard.outputs.skip != '1'
        run: python3 scripts/test_scan.py
      - name: Scan roasters
        if: steps.guard.outputs.skip != '1'
        env:
          ONLY: ${{ github.event.inputs.only }}
          INSPECT: ${{ github.event.inputs.inspect }}
        run: |
          if [ -n "$INSPECT" ]; then python3 scripts/scan.py --inspect "$INSPECT"; exit 0; fi
          if [ -n "$ONLY" ]; then python3 scripts/scan.py --only "$ONLY"; else python3 scripts/scan.py; fi
      - name: Commit updated list
        if: steps.guard.outputs.skip != '1'
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/releases.json data/seen.json
          if [ -f data/scan_report.json ]; then git add data/scan_report.json; fi   # what the run left for tomorrow
          if git diff --cached --quiet; then
            echo "No changes"
          else
            # a partial rescan is labelled differently so it never counts as the day's full scan
            if [ -n "$ONLY" ]; then git commit -m "Roaster rescan ($ONLY) $(date -u +'%d %b %Y')"; else git commit -m "Roaster scan $(date -u +'%d %b %Y')"; fi
            # main may have moved while the scan ran (a site change merged meanwhile)
            git pull --rebase -q && git push
          fi
