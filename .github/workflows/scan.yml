name: Daily roaster scan

on:
  schedule:
    - cron: "31 5 * * *"   # every morning, 05:31 UTC (05:31 UK in winter, 06:31 in summer)
  workflow_dispatch:
    inputs:
      only:
        description: "Rescan only these roasters (comma-separated names). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan roasters
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python3 scripts/scan.py --only "$ONLY"; else python3 scripts/scan.py; fi
      - name: Commit updated list
        run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/releases.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Roaster scan $(date -u +%d/%m/%Y)"
            git push
          fi
