name: Weekly roaster scan

on:
  schedule:
    - cron: "31 5 * * 1"   # Mondays 05:31 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan UK roasters
        run: python3 scripts/scan.py
      - name: Commit updated list
        run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/releases.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly roaster scan $(date -u +%d/%m/%Y)"
            git push
          fi
