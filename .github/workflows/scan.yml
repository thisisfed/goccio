name: Daily roaster scan

on:
  schedule:
    # every night at 02:31 UTC (02:31 UK in winter, 03:31 in summer), done by about 05:00. GitHub runs its schedules late when it's busy
    # (often by hours), so the scan clock, a Cloudflare Worker (workers/scan-clock), starts it on time; these stay as
    # backups and skip themselves once today's full scan is in.
    - cron: "31 2 * * *"
    - cron: "13 5 * * *"
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Rescan only these roasters (comma-separated names). Leave empty for all."
        required: false
        default: ""
      daily:
        description: "Set by the scan clock (Cloudflare): skip if today's scan is already in."
        required: false
        default: ""
      inspect:
        description: "Only print what these product pages say (comma-separated URLs; raw:<url> for the source, text:<url> for the words only); nothing is saved."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  # 1. check: today's scan not in yet, and the scanner still passes every reported mistake. All parts then read the same commit
  prep:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 50
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Skip if today's full scan is already in
        id: guard
        env:
          INSPECT: ${{ github.event.inputs.inspect }}
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.daily }}" = "1" ]; } && git log --format=%s | grep -qx "Roaster scan $(date -u +'%d %b %Y')"; then
            echo "Today's scan is already in, nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$INSPECT" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the scanner against every reported mistake
        # if an old mistake is back, the scan stops here and yesterday's list stays up
        run: |   # quiet: the logs of a public repo are public, so only the count and any failure's name are shown, never the list of fixes
          python3 scripts/test_scan.py > /tmp/tests.log 2>&1 && tail -n 1 /tmp/tests.log || { grep '^FAIL' /tmp/tests.log | cut -c1-80; tail -n 1 /tmp/tests.log; exit 1; }
      - name: Inspect pages (nothing is saved)
        if: github.event.inputs.inspect != ''
        env:
          INSPECT: ${{ github.event.inputs.inspect }}
        run: python3 scripts/scan.py --inspect "$INSPECT"

  # 2. four machines at once, each reading every fourth roaster; each has its own 4 hours (free on a public repo)
  part:
    needs: prep
    if: needs.prep.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 270   # a part saves by 240 minutes (scripts/scan.py STOP_MINUTES); GitHub allows 360
    strategy:
      fail-fast: false   # one part failing never stops the others: its roasters keep yesterday's coffees
      matrix:
        k: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan a quarter of the roasters
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python3 scripts/scan.py --only "$ONLY" --shard ${{ matrix.k }}/4 --part parts/part-${{ matrix.k }}.json
          else python3 scripts/scan.py --shard ${{ matrix.k }}/4 --part parts/part-${{ matrix.k }}.json; fi
      - uses: actions/upload-artifact@v6
        with:
          name: part-${{ matrix.k }}
          path: parts/
          retention-days: 3

  # 3. put the parts together on the newest main, write the list and save it. The only job that commits, so no clashes
  merge:
    needs: [prep, part]
    if: always() && needs.prep.result == 'success' && needs.prep.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 50
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: part-*
          path: parts
        continue-on-error: true   # no parts at all: every roaster keeps yesterday's coffees
      - name: Put the parts together
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p parts
          if [ -n "$ONLY" ]; then python3 scripts/scan.py --only "$ONLY" --merge parts; else python3 scripts/scan.py --merge parts; fi
      - name: Hold back today's odd coffees (data/held.json; publishing leaves them off until you tick Show it in the email)
        run: python3 scripts/odd_coffees.py --hold || echo "Nothing held this time"
      - name: Commit updated list
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/releases.json data/seen.json
          if [ -f data/held.json ]; then git add data/held.json; fi   # today's odd coffees, held back for a look
          if [ -f data/scan_report.json ]; then git add data/scan_report.json; fi   # what the run left for tomorrow
          if [ -f data/weak.json ]; then git add data/weak.json; fi       # shops on watch for rarely stating process or variety
          if [ -f data/banned.json ]; then git add data/banned.json; fi   # shops banned for not being specialty
          if git diff --cached --quiet; then
            echo "No changes"
          else
            # a partial rescan is labelled differently so it never counts as the day's full scan
            if [ -n "$ONLY" ]; then git commit -m "Roaster rescan ($ONLY) $(date -u +'%d %b %Y')"; else git commit -m "Roaster scan $(date -u +'%d %b %Y')"; fi
            # main may have moved while the parts were being put together (a site change merged meanwhile)
            # a site change merged in the seconds between the pull and the push rejected it once (25 Nov 2026, the day's whole scan lost):
          # pull and push again, a few times, before giving up
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q -X theirs && git push && exit 0   # during a rebase "theirs" is this scan: today's list wins
            echo "push refused, try $i of 6"; sleep $((i * 10))
          done
          exit 1
          fi
