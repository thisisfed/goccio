name: Debug shops (one-off)
on:
  push:
    branches: [dbg-shops]
permissions:
  contents: write
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/dbg_shops.py
      - run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/dbg_shops.txt && git commit -m "Debug output" && git push || true
