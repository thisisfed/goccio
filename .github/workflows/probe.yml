name: Probe shops (one-off)
on:
  push:
    branches: [south-america]
    paths: ["scripts/probe_sa.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/probe_sa.py
      - run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/probe_sa.txt && git commit -m "Probe output" && git pull --rebase -q && git push || true
