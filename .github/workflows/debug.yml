name: Debug (one-off)
on:
  push:
    branches: [scan-quality]
    paths: ["scripts/debug_roast.py"]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/debug_roast.py
      - run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/debug_roast.txt && git commit -m "Debug output" && git pull --rebase -q && git push || true
