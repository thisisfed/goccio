name: New roasters worldwide

# Every night, before the morning scans: roasteries on OpenStreetMap that aren't on the list yet are read the way the daily
# scan reads them, and up to 10 that sell specialty coffee beans are added to data/roasters.json. None found: nothing changes.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      max_add:
        description: "Most roasters to add this run"
        default: "25"
      max_try:
        description: "Most shops to try this run"
        default: "100"

permissions:
  contents: write

concurrency:
  group: world   # its own queue: in the scan's, a newer scan waiting in line cancelled it
  cancel-in-progress: false

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # the map region by region (with a retry each), then eight shops at a time, about a minute each
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Find and check
        run: python scripts/world.py
        env:
          WORLD_MAX_ADD: ${{ inputs.max_add }}
          WORLD_MAX_TRY: ${{ inputs.max_try }}
      - name: Save
        run: |
          git add data/roasters.json data/world_seen.json data/world_map.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -qm "New roasters worldwide $(date -u +'%d %b %Y')"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
