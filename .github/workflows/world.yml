name: New roasters worldwide

# Every night, before the morning scans: roasteries on OpenStreetMap that aren't on the list yet are read the way the daily
# scan reads them, and every one that sells specialty coffee beans is added to data/roasters.json (no daily cap since 27/11/2026).
# Sources: the map's roasteries, coffee-bean shops and roasting cafés, the whole UK roaster directory and Wikidata.
# Started at 00:31 UTC by the scan clock (Cloudflare), so the 02:31 scan reads the new roasters. GitHub's own schedule
# below is only a backup and often runs hours late: roasters it adds after the day's scan are scanned straight away.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      max_add:
        description: "Most roasters to add this run"
        default: "1000"
      max_try:
        description: "Most shops to try this run"
        default: "1800"
      audit:
        description: "Instead: re-read the roasters it added before for shops selling other roasters' coffee (report, or fix to take them off)"
        default: ""

permissions:
  contents: write
  actions: write   # to start a scan of just the new roasters

concurrency:
  group: world   # its own queue: in the scan's, a newer scan waiting in line cancelled it
  cancel-in-progress: false

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # the map region by region (with a retry each), then twelve shops at a time, about a minute each (up to 1,800)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Find and check
        run: |
          cp data/roasters.json /tmp/roasters_before.json
          if [ "$AUDIT" = "fix" ]; then python scripts/world.py --audit --fix; elif [ -n "$AUDIT" ]; then python scripts/world.py --audit; else python scripts/world.py; fi
        env:
          PYTHONUNBUFFERED: "1"   # its progress shows in the log as it goes (28/11/2026: five silent hours, then cancelled)
          WORLD_MAX_ADD: ${{ inputs.max_add }}
          WORLD_MAX_TRY: ${{ inputs.max_try }}
          AUDIT: ${{ inputs.audit }}
      - name: Save
        run: |
          git add data/roasters.json data/world_seen.json data/world_map.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            # the run's own copies first: if main moved meanwhile and the rebase clashes, its finds are put back on top of the newer files
            mkdir -p /tmp/world_ours && cp data/roasters.json data/world_seen.json /tmp/world_ours/ && { cp data/world_map.json /tmp/world_ours/ 2>/dev/null || true; }
            git commit -qm "New roasters worldwide $(date -u +'%d %b %Y')"
            for i in 1 2 3 4; do
              if git pull -q --rebase && git push -q; then break; fi
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              python3 scripts/merge_world.py /tmp/world_ours
              git add data/roasters.json data/world_seen.json data/world_map.json 2>/dev/null || true
              git diff --cached --quiet || git commit -qm "New roasters worldwide $(date -u +'%d %b %Y')"
              sleep 5
            done
          fi
      - name: Scan the new roasters now if today's scan has already gone by
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/scan_new.sh /tmp/roasters_before.json
