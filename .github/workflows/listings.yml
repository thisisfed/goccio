name: Listing requests

# Every morning before the roaster scan: requests from the "Get your roastery listed" page arrive as issues (in the private
# thisisfed/goccio-requests repo, so roasters' emails never sit in this public one) labelled
# "listing". Each shop is checked with the real scanner; the ones with coffee are added to data/roasters.json and the
# issue is answered and closed. A shop it can't read stays open for a person to look at.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start a scan of just the new roasters
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  listings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check requests
        env:
          GH_TOKEN: ${{ secrets.LISTING_TOKEN }}   # it reaches the private requests repo; the workflow's own token can't
          REQUESTS_REPO: thisisfed/goccio-requests
        run: cp data/roasters.json /tmp/roasters_before.json && python scripts/discover.py --listings
      - name: Save new roasters
        run: |
          if ! git diff --quiet data/roasters.json data/removed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Listing and removal requests $(date -u +'%d %b %Y')"
            git push -q
          fi
      - name: Scan the new roasters now if today's scan has already gone by
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/scan_new.sh /tmp/roasters_before.json
