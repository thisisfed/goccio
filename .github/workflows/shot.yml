name: Page screenshots
# Takes full-page screenshots of public pages (design reference, checking the live site), saved as a run artifact.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated URLs"
        required: true
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir shots
          python - <<'PY'
          import os, asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for i, u in enumerate([x.strip() for x in os.environ["URLS"].split(",") if x.strip()]):
                      for w, h, tag in [(1440, 900, "d"), (390, 844, "m")]:
                          pg = await b.new_page(viewport={"width": w, "height": h})
                          try:
                              await pg.goto(u, wait_until="networkidle", timeout=45000); await pg.wait_for_timeout(2500)
                              await pg.screenshot(path=f"shots/{i}-{tag}.png", full_page=True)
                              css = await pg.evaluate("""() => { const o = {}; for (const s of ['body','h1','h2','a','button','p','nav a','header']) { const e = document.querySelector(s); if (e) { const c = getComputedStyle(e); o[s] = [c.fontFamily, c.fontSize, c.fontWeight, c.letterSpacing, c.textTransform, c.color, c.backgroundColor, c.lineHeight].join(' | ') } } return o }""")
                              print(u, tag, css)
                          except Exception as e:
                              print(u, tag, "ERR", e)
                          await pg.close()
                  await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
