name: Visits

# By hand only: page views from Cloudflare Web Analytics (no cookies, totals only), grouped by where visitors came from,
# their country and browser, so search-engine visits can be told from our own checks (HeadlessChrome) and direct visits.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "First day, YYYY-MM-DD"
        required: false
        default: ""

jobs:
  visits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: 1c3773d3175301c1a989184b445ac1f2
      SINCE: ${{ inputs.since }}
    steps:
      - name: Page views by referrer, country and browser
        run: |
          S="${SINCE:-$(date -u -d '-30 days' +%F)}"; T="$(date -u -d '+1 day' +%F)"
          q() { jq -n --arg acc "$ACC" --arg s "$S" --arg t "$T" --arg dims "$1" '{query: ("query($acc:String!,$s:Date!,$t:Date!){viewer{accounts(filter:{accountTag:$acc}){rumPageloadEventsAdaptiveGroups(limit:200,filter:{date_geq:$s,date_lt:$t},orderBy:[count_DESC]){count sum{visits} dimensions{" + $dims + "}}}}}"), variables:{acc:$acc,s:$s,t:$t}}' \
            | curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d @-; }
          echo "== since $S =="
          for d in "date" "refererHost" "countryName" "userAgentBrowser" "deviceType" "refererHost countryName userAgentBrowser"; do
            echo "== by $d =="; q "$d" | jq -r '.errors // empty, (.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups // [] | .[] | "\(.count)\t\(.sum.visits)\t\(.dimensions | [.[]] | map(tostring) | join(" | "))")'
          done
