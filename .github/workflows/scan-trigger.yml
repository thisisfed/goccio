name: Publish scan trigger

# Puts the Cloudflare Worker in worker/ live: it starts the daily scan at 05:31 UTC on the minute.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (already there for the site) and SCAN_TRIGGER_TOKEN,
# a GitHub fine-grained token for thisisfed/v60 with "Actions: Read and write". Does nothing until both exist.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/scan-trigger.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1c3773d3175301c1a989184b445ac1f2
      SCAN_TRIGGER_TOKEN: ${{ secrets.SCAN_TRIGGER_TOKEN }}
    steps:
      - name: Skip until both tokens are added
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$SCAN_TRIGGER_TOKEN" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or SCAN_TRIGGER_TOKEN, nothing to do."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "22"
      - name: Publish the Worker and give it the GitHub token
        if: steps.gate.outputs.go == 'yes'
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy
          printf '%s' "$SCAN_TRIGGER_TOKEN" | npx --yes wrangler@4 secret put GH_TOKEN
