name: Scanner tests

# Every scanner mistake that has been reported (scripts/test_scan.py) must stay fixed. Runs on every change to the
# scanner, on any branch, so a change that brings an old mistake back shows a red cross before it's merged.
on:
  push:
    paths: ["scripts/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/test_scan.py
