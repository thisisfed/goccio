name: Publish to Cloudflare

# Publishes the site straight to the Cloudflare Pages project "v60", so a stuck
# Cloudflare <-> GitHub link can't hold updates back. Runs on every change to main,
# after each roaster scan (scan commits don't trigger other workflows on their own),
# and by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily roaster scan", "Promote a roaster"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1c3773d3175301c1a989184b445ac1f2
      LISTING_TOKEN: ${{ secrets.LISTING_TOKEN }}
    steps:
      - name: Skip until the token is added
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret yet, nothing to do."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          ref: main

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.12"

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        run: |
          # safety net 1: every script in the page must parse, or nothing is published (the live site stays as it was)
          node scripts/check_js.js index.html
          # only what the site serves: the page, its data, the share-image function and the home screen icons
          mkdir -p /tmp/site
          cp index.html CNAME /tmp/site/ 2>/dev/null || cp index.html /tmp/site/
          cp -r data /tmp/site/data
          python scripts/latest.py /tmp/site || echo "No small first file this time"
          python scripts/build.py /tmp/site || echo "Page not split this time: it goes out whole"   # code and styles into minified files kept for a year, a lighter coffee list, cache times (_headers)
          python scripts/italian.py /tmp/site || echo "No Italian page this time"   # goccio.co.uk/it: the same page in Italian at its own address   # the newest coffees, shown before the full list arrives
          cp -r functions /tmp/site/functions
          cp -r lib /tmp/site/lib   # the QR code maker, fetched only when a computer asks for it
          cp -r list /tmp/site/list   # Get your roastery listed (its form posts to functions/api/list.js)
          cp -r privacy /tmp/site/privacy
          cp -r health /tmp/site/health   # the health page (not linked, not indexed): last scan, brew answers, new and unreadable roasters
          cp -r img /tmp/site/img   # photos
          cp -r og /tmp/site/og   # the picture a shared link shows (design/og-card.html)
          cp -r fonts /tmp/site/fonts   # ALT Riviera: Medium for the whole site, Regular (four letters) for the big Goccio
          cp -r icons /tmp/site/icons && cp icons/apple-touch-icon.png /tmp/site/apple-touch-icon.png && cp icons/favicon.ico /tmp/site/favicon.ico   # iPhones look at /apple-touch-icon.png, browsers at /favicon.ico
          # a page per coffee and per roaster, plus sitemap.xml, for search engines; the recipes come from the app's own engine.
          # Tried twice. If it still fails, nothing is published: the live site keeps yesterday's pages instead of losing them
          # (on 25/11/2026 a quiet "skipped" left the site without them for 15 hours)
          pip install -q playwright==1.63.0
          python scripts/pages.py /tmp/site || { sleep 20; python scripts/pages.py /tmp/site; } || { echo "::error::Coffee pages failed twice: not publishing, the site stays as it was"; exit 1; }
          # safety net 2: the folder about to go live must hold the whole site (page, Italian page, data, coffee pages, sitemap)
          python scripts/check_build.py /tmp/site
          node scripts/check_js.js /tmp/site/index.html /tmp/site/it/index.html
          for f in /tmp/site/assets/*.js /tmp/site/lib/*.js; do [ -f "$f" ] && node --check "$f"; done   # the page's code, split out into files
          # the listing form files requests as issues with this token (Settings > Secrets > Actions). It's checked first: it makes the
          # "listing" label (201) or finds it there (422); 401/403 = an old or wrong token. Only a working one is handed to the site,
          # so a stale GitHub secret never replaces a good token set straight in Cloudflare
          if [ -n "$LISTING_TOKEN" ]; then code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $LISTING_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/thisisfed/goccio-requests/labels -d '{"name":"listing","color":"ff4f00"}'); echo "Listing token check: HTTP $code"
            if [ "$code" = "201" ] || [ "$code" = "422" ]; then printf '%s' "$LISTING_TOKEN" | npx --yes wrangler@4 pages secret put LISTING_TOKEN --project-name=v60 >/dev/null 2>&1 && echo "Listing token set" || echo "Couldn't set the listing token"; else echo "Listing token not working: the site keeps the one it has"; fi
          else echo "No LISTING_TOKEN secret yet"; fi
          cd /tmp/site
          npx --yes wrangler@4 pages deploy . --project-name=v60 --branch=main --commit-dirty=true
