name: Publish to Cloudflare

# Publishes the site straight to the Cloudflare Pages project "v60", so a stuck
# Cloudflare <-> GitHub link can't hold updates back. Runs on every change to main,
# after each roaster scan (scan commits don't trigger other workflows on their own),
# and by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily roaster scan"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1c3773d3175301c1a989184b445ac1f2
      LISTING_TOKEN: ${{ secrets.LISTING_TOKEN }}
    steps:
      - name: Skip until the token is added
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret yet, nothing to do."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.12"

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        run: |
          # only what the site serves: the page, its data, the share-image function and the home screen icons
          mkdir -p /tmp/site
          cp index.html CNAME /tmp/site/ 2>/dev/null || cp index.html /tmp/site/
          cp -r data /tmp/site/data
          cp -r functions /tmp/site/functions
          cp -r lib /tmp/site/lib   # the QR code maker, fetched only when a computer asks for it
          cp -r list /tmp/site/list   # Get your roastery listed (its form posts to functions/api/list.js)
          cp -r privacy /tmp/site/privacy
          cp -r img /tmp/site/img   # photos
          cp -r fonts /tmp/site/fonts   # the Goccio wordmark (ALT Riviera Regular, only its five letters)
          cp -r icons /tmp/site/icons && cp icons/apple-touch-icon.png /tmp/site/apple-touch-icon.png   # iPhones also look at /apple-touch-icon.png
          # a page per coffee and per roaster, plus sitemap.xml, for search engines; the recipes come from the app's own engine.
          # If this step fails the site still goes out, just without those pages.
          pip install -q playwright==1.63.0 && python scripts/pages.py /tmp/site || echo "Coffee pages skipped this time"
          # the listing form files requests as issues with this token, when it has been added (Settings > Secrets > Actions)
          if [ -n "$LISTING_TOKEN" ]; then printf '%s' "$LISTING_TOKEN" | npx --yes wrangler@4 pages secret put LISTING_TOKEN --project-name=v60 >/dev/null 2>&1 && echo "Listing token set" || echo "Couldn't set the listing token"; fi
          # does the token work? It makes the "listing" label (201) or finds it there (422); 401/403 = wrong token or permission
          if [ -n "$LISTING_TOKEN" ]; then echo "Listing token check: HTTP $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $LISTING_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/thisisfed/v60/labels -d '{"name":"listing","color":"ff4f00"}')"; else echo "No LISTING_TOKEN secret yet"; fi
          cd /tmp/site
          npx --yes wrangler@4 pages deploy . --project-name=v60 --branch=main --commit-dirty=true
