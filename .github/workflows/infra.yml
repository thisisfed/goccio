name: Cloudflare check

# By hand only: shows what the Cloudflare token is allowed to do (Pages, D1 database), without changing anything.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1c3773d3175301c1a989184b445ac1f2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Token
        run: npx --yes wrangler@4 whoami || true
      - name: D1 databases
        run: npx --yes wrangler@4 d1 list || true
      - name: KV namespaces
        run: npx --yes wrangler@4 kv namespace list || true
