name: Find roaster addresses

# Reads each roaster's own site for the address it publishes (scripts/addresses.py) and saves data/addresses.json,
# which the roaster pages show. Run it by hand from the Actions tab when roasters are added.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/addresses.py
      - run: |
          git config user.name "v60-scan-bot"
          git config user.email "v60-scan-bot@users.noreply.github.com"
          git add data/addresses.json && git commit -m "Roaster addresses" && git pull --rebase -q && git push || true
