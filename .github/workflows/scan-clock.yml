name: Scan clock (Cloudflare)

# Deploys the small Cloudflare Worker that starts the daily roaster scan on time (workers/scan-clock).
on:
  push:
    branches: [main]
    paths: ["workers/scan-clock/**", ".github/workflows/scan-clock.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1c3773d3175301c1a989184b445ac1f2
      SCAN_CLOCK_TOKEN: ${{ secrets.SCAN_CLOCK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/private   # the scanner and Goccio's knowledge live in the private repo
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy the Worker
        working-directory: workers/scan-clock
        run: npx --yes wrangler@4 deploy
      # optional: a token kept as a GitHub secret instead of in Cloudflare
      - name: Hand it the GitHub token (only if kept in GitHub)
        if: env.SCAN_CLOCK_TOKEN != ''
        working-directory: workers/scan-clock
        run: printf '%s' "$SCAN_CLOCK_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN >/dev/null && echo "Token set"
