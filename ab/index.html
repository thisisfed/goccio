<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Goccio: A or B?</title>
<link rel="icon" href="/icons/favicon.ico">
<style>
  :root { --sans: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #000; color: #fff; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 1400px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 48px); }
  h1 { font-size: 39px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; text-align: center; }
  .sub { font-size: 15px; color: #8a8a8a; text-align: center; margin-top: 12px; }
  .pair { display: grid; grid-template-columns: 1fr; gap: 40px; margin-top: 40px; }
  @media (min-width: 820px) { .pair { grid-template-columns: 1fr 1fr; gap: 24px; } }
  figure { text-align: center; }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  .tag { display: inline-flex; align-items: center; gap: 12px; margin-top: 8px; }
  .L { font-size: 39px; font-weight: 600; color: #f08a4b; }
  figcaption span { font-size: 15px; color: #8a8a8a; }
  footer { margin-top: 48px; text-align: center; font-size: 15px; }
  footer a { color: #8a8a8a; }
</style>
</head>
<body>
<main>
  <h1>A or B?</h1>
  <p class="sub">Two versions of Goccio. Which one would you keep?</p>
  <div class="pair">
    <figure>
      <img src="a.webp" alt="Goccio A: a glossy orange ball with a shine on top and two black eyes" width="1200" height="1200">
      <figcaption class="tag"><b class="L">A</b><span>Glossy</span></figcaption>
    </figure>
    <figure>
      <img src="b.webp" alt="Goccio B: a ball of coffee crema foam with two satin black eyes" width="1200" height="1200">
      <figcaption class="tag"><b class="L">B</b><span>Crema foam</span></figcaption>
    </figure>
  </div>
  <footer><a href="/">goccio.co.uk</a></footer>
</main>
</body>
</html>
