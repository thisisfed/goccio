<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#f6f1ea;color:#231b15;font-family:-apple-system,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:-.022em;padding:72px 80px;display:grid;grid-template-columns:1fr 470px;gap:56px;align-items:center;position:relative;overflow:hidden}
.g{background:linear-gradient(100deg,#d9a066 0%,#a8653a 45%,#6b3d22 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark{font-weight:700;font-size:44px;letter-spacing:-.035em;line-height:1}
.mark span{color:#776a5f}.mark .g{color:transparent}
h1{font-size:76px;line-height:1.02;font-weight:700;letter-spacing:-.04em;margin-top:34px}
h1 em{font-style:normal;color:#776a5f}
p{margin-top:26px;font-size:25px;line-height:1.3;color:#776a5f;letter-spacing:-.015em}
.card{background:#fffdf9;border-radius:34px;box-shadow:0 1px 1px rgba(70,45,25,.05),0 24px 60px -28px rgba(70,45,25,.35);padding:30px 32px 28px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.nm{font-size:25px;font-weight:600;letter-spacing:-.02em}
.eg{font-size:13px;font-weight:700;letter-spacing:.08em;color:#776a5f}
.specs{display:flex;gap:24px;margin-top:20px;font-size:18px;color:#776a5f;font-variant-numeric:tabular-nums}
.specs b{font-size:38px;font-weight:600;letter-spacing:-.035em;color:#231b15}
.specs .k b{color:#0071e3}
.line{position:relative;height:84px;margin-top:22px}
.line:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:9px;background:linear-gradient(90deg,rgba(196,82,31,.32) 0 56.4%,rgba(35,27,21,.09) 56.4%)}
.p{position:absolute;top:0;padding-top:20px;font-size:15px;color:#776a5f;font-variant-numeric:tabular-nums}
.p:before{content:"";position:absolute;top:-5px;left:-2px;width:16px;height:16px;border-radius:50%;background:#c4521f;box-shadow:0 0 0 4px #fffdf9}
.p b{display:block;font-size:21px;color:#231b15;font-weight:600;margin-top:2px}
.p.end{right:0;text-align:right}.p.end:before{left:auto;right:-2px;background:#776a5f}
.url{position:absolute;left:80px;bottom:46px;font-size:22px;font-weight:600;color:#6f3f22;letter-spacing:-.01em}
</style></head><body>
<div>
  <div class="mark"><span class="g">V60</span> <span>Brew Card</span></div>
  <h1>New coffees.<br><em>The recipe for each bag.</em></h1>
  <p>Grind for your grinder, ratio, temperature and every pour. New filter coffees from 90+ roasters, every morning.</p>
</div>
<div class="card">
  <div class="top"><span class="nm">Washed Ethiopia, light</span><span class="eg">EXAMPLE</span></div>
  <div class="specs"><span class="k"><b>21</b> clicks</span><span><b>15 → 255</b> g</span><span><b>96</b>°C</span></div>
  <div class="line">
    <div class="p" style="left:0"><span>0:00</span><b>51 g</b></div>
    <div class="p" style="left:23%"><span>0:45</span><b>102 g</b></div>
    <div class="p" style="left:56.4%"><span>1:50</span><b>255 g</b></div>
    <div class="p end"><span>3:15</span><b style="color:#776a5f">done</b></div>
    <span class="p" style="left:35.9%;padding:0;font-size:0"></span><span class="p" style="left:46.2%;padding:0;font-size:0"></span>
  </div>
</div>
<div class="url">v60.thisisfed.xyz</div>
</body></html>
